name: Continuous Deployment (CD) - Staging Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify-and-test:
    name: Verification & Quality Gates (CI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Dar permisos de ejecución al Maven Wrapper
        run: chmod +x mvnw

      - name: Compilar, ejecutar pruebas y verificar calidad
        run: ./mvnw -B clean verify

  deploy-to-staging:
    name: Deploy Application to Staging Cloud
    needs: verify-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Staging Deployment Webhook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          echo "Ejecutando despliegue automatico a ambiente Staging..."
          curl --fail --silent --show-error -X POST "$DEPLOY_HOOK_URL"
          echo "Despliegue solicitado a Render"

      - name: Verificar salud del servicio (Healthcheck)
        env:
          STAGING_URL: https://agrovalle-connect-5vhc.onrender.com
        run: |
          echo "Esperando a que Staging responda..."
          sleep 60
          curl --fail --silent --show-error \
            --retry 20 --retry-delay 15 --retry-all-errors \
            "$STAGING_URL/api/v1/estado"
          echo ""
          echo "Staging responde HTTP 200 OK"